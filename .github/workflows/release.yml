name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag para generar la release manualmente (ej. v0.1.0-alpha.1)'
        required: true
        default: 'v0.1.0-alpha.1'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve Tag & Pre-release Status
        id: meta
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          
          if [[ "$TAG" =~ -(alpha|beta|rc) ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Pre-release detectada: Sí ($TAG)"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Pre-release detectada: No ($TAG)"
          fi

      - name: Package Release Archive (.tar.gz)
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          ARCHIVE_NAME="KeepMyConfig-${TAG}.tar.gz"
          tar --exclude='.git' \
              --exclude='.github' \
              --exclude='user_data' \
              --exclude='tests' \
              -czf "$ARCHIVE_NAME" \
              backup_manager.sh \
              lib \
              config \
              modules.d \
              markers \
              .backup_app_marker \
              LICENSE \
              README.md \
              MANUAL_USUARIO.md \
              ESPECIFICACION.md \
              CHANGELOG.md
          echo "ARCHIVE_PATH=$ARCHIVE_NAME" >> "$GITHUB_ENV"

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: ${{ env.ARCHIVE_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

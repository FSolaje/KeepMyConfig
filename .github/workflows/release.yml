name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag para generar la release manualmente (ej. v0.1.0-alpha.1)'
        required: true
        default: 'v0.1.0-alpha.1'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Resolve Tag & Pre-release Status
        id: meta
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          
          if [[ "$TAG" =~ -(alpha|beta|rc) ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Pre-release detectada: Sí ($TAG)"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Pre-release detectada: No ($TAG)"
          fi

      - name: Build Official Distribution Packages & Checksums
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          chmod +x scripts/package.sh
          ./scripts/package.sh --version "$TAG" --output-dir dist --type all --clean

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: |
            dist/KeepMyConfig-*.tar.*
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

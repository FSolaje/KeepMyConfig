name: CI Test Suite

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    name: Run Unit Tests & Syntax Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y whiptail zstd gnupg

      - name: Verify Bash Syntax (bash -n)
        run: |
          find . -type f \( -name "*.sh" -o -name "*.conf" \) -not -path "*/.git/*" -exec bash -n {} +

      - name: Normalize Executable Permissions
        run: |
          chmod +x backup_manager.sh install.sh uninstall.sh scripts/package.sh tests/test_*.sh

      - name: Run Test Suites
        run: |
          FAILED=0
          for test_file in tests/test_*.sh; do
            echo "::group::Running $test_file"
            if ! bash "$test_file"; then
              echo "::error file=$test_file::Test suite $test_file failed!"
              FAILED=1
            fi
            echo "::endgroup::"
          done
          if [[ $FAILED -ne 0 ]]; then
            echo "❌ Una o más suites de pruebas unitarias han fallado."
            exit 1
          fi

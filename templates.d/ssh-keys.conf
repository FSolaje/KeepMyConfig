# ==============================================================================
# Plantilla de Receta: Identidades y Claves SSH (Vault & Shred)
# ==============================================================================

MODULE_ID="ssh-keys"
MODULE_NAME="Claves SSH y Configuración de Conexiones (.ssh)"
MODULE_TAGS=("system" "sensitive")

MODULE_PATHS=(
    ".ssh/id_rsa"
    ".ssh/id_rsa.pub"
    ".ssh/id_ed25519"
    ".ssh/id_ed25519.pub"
    ".ssh/config"
    ".ssh/known_hosts"
)

IS_SENSITIVE=true
PURGE_AFTER_BACKUP=true
POST_RESTORE_HOOK="chmod 700 .ssh 2>/dev/null; chmod 600 .ssh/id_* 2>/dev/null; chmod 644 .ssh/*.pub .ssh/config .ssh/known_hosts 2>/dev/null || true"

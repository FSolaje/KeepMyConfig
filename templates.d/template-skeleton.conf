# ==============================================================================
# KeepMyConfig - Plantilla Esqueleto de Referencia (template-skeleton.conf)
# ==============================================================================
# Este archivo sirve como guía canónica y documentación de referencia para la
# creación manual de recetas de respaldo en KeepMyConfig.
#
# Convenciones obligatorias:
# 1. Rutas Relativas: MODULE_PATHS debe contener rutas relativas respecto al
#    directorio $HOME del usuario. NO incluir prefijos como $HOME, ~, o /home/usuario.
#    El sistema rechazará rutas absolutas locales y navegación '..'.
# 2. Sintaxis Bash Estricta: Todas las directivas se evalúan en bash aislado.
#    Las etiquetas y rutas deben definirse como arrays de Bash con paréntesis.
# ==============================================================================

# Identificador único de la receta (alfanumérico, guiones y guiones bajos)
# Debe coincidir exactamente con el nombre del archivo sin la extensión .conf
MODULE_ID="mi-aplicacion"

# Nombre descriptivo que se mostrará en las interfaces TUI y CLI
MODULE_NAME="Mi Aplicación - Configuración y Preferencias"

# Categorías o etiquetas de agrupación para respaldos colectivos (ej. dev, office, web, system)
MODULE_TAGS=(
    "dev"
    "custom"
)

# Lista de ficheros o carpetas a respaldar (rutas relativas a $HOME)
MODULE_PATHS=(
    ".config/mi-app/config.json"
    ".config/mi-app/preferencias.ini"
)

# Cifrado GPG AES-256 simétrico (true: protegido con contraseña | false: archivo plano tar.zst)
IS_SENSITIVE=false

# Purga segura de origen tras el respaldo (true: borrado con shred -u -z -n 3 | false: conservar origen)
# ATENCIÓN: Activar 'true' únicamente para datos confidenciales temporales o llaves exportadas.
PURGE_AFTER_BACKUP=false

# Comando o script Bash a ejecutar tras la restauración en el equipo destino (opcional)
# Ejemplo: ajuste de permisos restrictivos (chmod 600/700) o recarga de servicios.
POST_RESTORE_HOOK=""

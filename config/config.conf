# ==============================================================================
# KeepMyConfig - Configuración General del Entorno
# ==============================================================================

# Estado de la configuración inicial (asistente de bienvenida en primera ejecución)
INITIAL_SETUP_DONE="false"

# Política de arranque: recordar último perfil (true) o iniciar siempre en default (false)
REMEMBER_LAST_PROFILE="true"

# Perfil de backup activo (por defecto 'default' para entorno global)
# Los perfiles especializados se configuran en profiles/<perfil>/profile.conf
ACTIVE_PROFILE="default"

# Directorio de usuario objetivo a respaldar (por defecto el HOME del usuario en sesión)
TARGET_USER_HOME="${TARGET_USER_HOME:-${HOME}}"

# Ruta universal de destino para las copias de seguridad
# Puede ser una ruta local (~/Backups/KeepMyConfig), externa (/media/$USER/...) o semántica (@media/<LABEL>/...)
BACKUP_DESTINATION="~/Backups/KeepMyConfig"

# Nombres de archivos testigo de seguridad (Safety Markers)
APP_MARKER_FILE=".backup_app_marker"
STORAGE_MARKER_FILE=".backup_storage_marker"

# Parámetros de empaquetado y compresión
COMPRESSION_ALGO="zstd"      # Opciones: zstd, gzip
COMPRESSION_LEVEL="3"

# Parámetros de seguridad criptográfica y borrado seguro (Vault & Shred)
GPG_CIPHER="AES256"
SHRED_ITERATIONS=3
SHRED_ZERO_PASS=true         # Sobrescribir con ceros finales (-z)

# Personalización visual de la interfaz TUI (Whiptail)
# Opciones: default, midnight, cyberdark, aubergine, amber
TUI_THEME="default"


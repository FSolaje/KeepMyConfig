# ==============================================================================
# BackupConfig - Configuración General del Entorno
# ==============================================================================

# Directorio de usuario objetivo a respaldar (por defecto el HOME del usuario en sesión)
TARGET_USER_HOME="${TARGET_USER_HOME:-${HOME}}"

# Identificación de la unidad o ruta de almacenamiento
# Métodos soportados:
#   - LABEL       : Busca la etiqueta de partición mediante lsblk / blkid
#   - UUID        : Busca el identificador único universal de partición
#   - STATIC_PATH : Usa una ruta fija de punto de montaje
#   - LOCAL_PATH  : Usa cualquier carpeta o disco local del equipo (o montaje de red)
STORAGE_ID_TYPE="LABEL"
STORAGE_ID_VALUE="DISCO_BACKUP"
STORAGE_SUBDIR="Backups/Lliurex25"

# Ruta estática alternativa de montaje si STORAGE_ID_TYPE no localiza el punto dinámico
STORAGE_STATIC_FALLBACK="/media/${USER}/DISCO_BACKUP"

# Nombres de archivos testigo de seguridad (Safety Markers)
APP_MARKER_FILE=".backup_app_marker"
STORAGE_MARKER_FILE=".backup_storage_marker"

# Parámetros de empaquetado y compresión
COMPRESSION_ALGO="zstd"      # Opciones: zstd, gzip
COMPRESSION_LEVEL="3"

# Parámetros de seguridad criptográfica y borrado seguro (Vault & Shred)
GPG_CIPHER="AES256"
SHRED_ITERATIONS=3
SHRED_ZERO_PASS=true         # Sobrescribir con ceros finales (-z)

# ==============================================================================
# Catálogo de Etiquetas Predefinidas (Tags)
# Formato: TAG_ID:DESCRIPCIÓN
# ==============================================================================
dev:Configuraciones de desarrollo, herramientas de programación y entornos
sensitive:Datos altamente sensibles, credenciales, tokens y llaves SSH/GPG
system:Configuraciones base del sistema, shell (bash/zsh) y perfiles de usuario
editor:Ajustes, atajos de teclado y snippets de editores de código (VSCode, Nano, etc.)
office:Herramientas ofimáticas, perfiles de navegador y productividad
